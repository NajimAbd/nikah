<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Nikah</title>
<link rel="stylesheet" href="css/style.css?v=20261017e">
</head>
<body>

<header class="site-header">
  <div class="container">
    <span class="logo">Nikah — administration</span>
    <nav class="site-nav"><a href="#" id="btnMdpAdmin" style="display:none;">Mot de passe</a><a href="#" id="btnSortir" style="display:none;">Se déconnecter</a></nav>
  </div>
</header>

<main class="espace">
  <div class="container">
    <div id="blocConnexion" class="carte-question" style="max-width:420px; margin:30px auto;">
      <h2>Accès administrateur</h2>
      <form id="formAdmin" novalidate>
        <div class="mdp-wrap">
          <input type="password" id="champMdpAdmin" class="champ-texte" placeholder="Mot de passe administrateur" autocomplete="current-password">
          <button type="button" class="mdp-oeil" id="oeilAdmin" data-cible="champMdpAdmin" aria-label="Afficher le mot de passe"></button>
        </div>
        <p id="erreurAdmin" style="color:#a33; font-family:Helvetica,Arial,sans-serif; font-size:0.9rem; margin-top:14px; display:none;"></p>
        <div class="nav-questionnaire"><span></span><button type="submit" class="btn btn-primary" id="btnAdmin">Entrer</button></div>
      </form>
      <p class="aide" style="margin-top:1.4em;"><a href="#" id="lienOubliAdmin">Mot de passe oublié ?</a></p>
      <p id="okOubliAdmin" style="color:#3d6b4f; font-family:Helvetica,Arial,sans-serif; font-size:0.95rem; margin-top:10px; display:none; background:#eef3ef; padding:12px; border-radius:8px;"></p>
    </div>

    <div id="blocOnglets" class="admin-onglets" style="display:none;">
      <button type="button" id="ongletProfils" class="actif">Profils</button>
      <button type="button" id="ongletMessages">Messages à contrôler</button>
      <button type="button" id="ongletApprouves">Messages approuvés</button>
      <button type="button" id="ongletRefuses">Messages refusés</button>
      <button type="button" id="ongletRetenus">Messages retenus</button>
      <button type="button" id="ongletSignalements">Signalements</button>
    </div>

    <div id="blocMessagesAdmin" style="display:none;">
      <h1 id="titreMessages">Messages à contrôler</h1>
      <p class="aide" id="resumeMessages"></p>
      <div id="listeMessagesAdmin" class="admin-liste"></div>
    </div>

    <div id="blocListe" style="display:none;">
      <h1>Profils inscrits</h1>
      <p class="aide" id="resumeAdmin"></p>
      <div id="listeAdmin" class="admin-liste"></div>
    </div>
  </div>
</main>

<div id="fenetreMdpAdmin" class="fenetre-chat" hidden>
  <div class="fenetre-chat-fond" data-fermer-mdp></div>
  <div class="fenetre-chat-boite" role="dialog" aria-labelledby="titreMdpAdmin">
    <div class="fenetre-chat-entete" style="display:flex; justify-content:space-between; align-items:center;">
      <strong id="titreMdpAdmin">Changer le mot de passe administrateur</strong>
      <button type="button" class="fenetre-chat-fermer" data-fermer-mdp aria-label="Fermer" style="background:none;border:0;font-size:1.4rem;cursor:pointer;">×</button>
    </div>
    <p class="aide" style="font-size:0.88rem;">Au moins 10 caractères, dont un caractère spécial. Un e-mail de confirmation sera envoyé à l'adresse de l'administrateur.</p>
    <form id="formMdpAdmin" novalidate>
      <div class="mdp-wrap"><input type="password" id="mdpAdminActuel" class="champ-texte" placeholder="Mot de passe actuel" autocomplete="current-password"><button type="button" class="mdp-oeil" data-cible="mdpAdminActuel" aria-label="Afficher le mot de passe"></button></div>
      <div class="mdp-wrap"><input type="password" id="mdpAdminNouveau" class="champ-texte" placeholder="Nouveau mot de passe" autocomplete="new-password"><button type="button" class="mdp-oeil" data-cible="mdpAdminNouveau" aria-label="Afficher le mot de passe"></button></div>
      <div class="mdp-wrap"><input type="password" id="mdpAdminNouveau2" class="champ-texte" placeholder="Confirmez le nouveau mot de passe" autocomplete="new-password"><button type="button" class="mdp-oeil" data-cible="mdpAdminNouveau2" aria-label="Afficher le mot de passe"></button></div>
      <p id="mdpAdminMessage" class="compte-message"></p>
      <div class="compte-actions"><button type="submit" class="btn btn-primary" id="btnMdpAdminValider">Enregistrer</button></div>
    </form>
  </div>
</div>

<script src="js/administration.js?v=20261017a"></script>
</body>
</html>
