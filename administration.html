<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Nikah</title>
<link rel="stylesheet" href="css/style.css?v=20261016i">
</head>
<body>

<header class="site-header">
  <div class="container">
    <span class="logo">Nikah — administration</span>
    <nav class="site-nav"><a href="#" id="btnSortir" style="display:none;">Se déconnecter</a></nav>
  </div>
</header>

<main class="espace">
  <div class="container">
    <div id="blocConnexion" class="carte-question" style="max-width:420px; margin:30px auto;">
      <h2>Accès administrateur</h2>
      <form id="formAdmin" novalidate>
        <div class="mdp-wrap">
          <input type="password" id="champMdpAdmin" class="champ-texte" placeholder="Mot de passe administrateur" autocomplete="current-password">
          <button type="button" class="mdp-oeil" id="oeilAdmin" data-cible="champMdpAdmin" aria-label="Afficher le mot de passe"></button>
        </div>
        <p id="erreurAdmin" style="color:#a33; font-family:Helvetica,Arial,sans-serif; font-size:0.9rem; margin-top:14px; display:none;"></p>
        <div class="nav-questionnaire"><span></span><button type="submit" class="btn btn-primary" id="btnAdmin">Entrer</button></div>
      </form>
      <p class="aide" style="margin-top:1.4em;"><a href="#" id="lienOubliAdmin">Mot de passe oublié ?</a></p>
      <p id="okOubliAdmin" style="color:#3d6b4f; font-family:Helvetica,Arial,sans-serif; font-size:0.95rem; margin-top:10px; display:none; background:#eef3ef; padding:12px; border-radius:8px;"></p>
    </div>

    <div id="blocOnglets" class="admin-onglets" style="display:none;">
      <button type="button" id="ongletProfils" class="actif">Profils</button>
      <button type="button" id="ongletMessages">Messages à contrôler</button>
      <button type="button" id="ongletApprouves">Messages approuvés</button>
      <button type="button" id="ongletRefuses">Messages refusés</button>
      <button type="button" id="ongletSignalements">Signalements</button>
    </div>

    <div id="blocMessagesAdmin" style="display:none;">
      <h1 id="titreMessages">Messages à contrôler</h1>
      <p class="aide" id="resumeMessages"></p>
      <div id="listeMessagesAdmin" class="admin-liste"></div>
    </div>

    <div id="blocListe" style="display:none;">
      <h1>Profils inscrits</h1>
      <p class="aide" id="resumeAdmin"></p>
      <div id="listeAdmin" class="admin-liste"></div>
    </div>
  </div>
</main>

<script src="js/administration.js?v=20261016i"></script>
</body>
</html>
